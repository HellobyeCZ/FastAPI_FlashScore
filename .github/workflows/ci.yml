name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flashscore
          POSTGRES_PASSWORD: flashscore
          POSTGRES_DB: flashscore
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      APP_STATS_FEED_SIGN: ci-sign
      APP_DEFAULT_HEADERS: '{"User-Agent":"ci"}'
      APP_DATABASE_URL: postgresql+asyncpg://flashscore:flashscore@localhost:5432/flashscore
      DATABASE_URL: postgresql+asyncpg://flashscore:flashscore@localhost:5432/flashscore
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"
      - run: uv sync
      - run: uv run ruff check app tests scripts
      - run: uv run mypy app
      - run: uv run pytest -ra

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
